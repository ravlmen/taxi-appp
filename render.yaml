services:
  - type: web
    name: taxi-koblizek
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/availability
    disk:
      name: taxi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/taxi-koblizek.sqlite
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: DRIVER_3_USERNAME
        sync: false
      - key: DRIVER_3_PASSWORD
        sync: false
